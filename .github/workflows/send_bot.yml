name: Kurslarni yuborish

on:
  schedule:
    - cron: "30 2 * * *"    # 07:30 Toshkent -> 08:00:00 gacha kutib yuboradi
    - cron: "30 7 * * *"    # 12:30 Toshkent -> 13:00:00 gacha kutib yuboradi
    - cron: "30 13 * * *"   # 18:30 Toshkent -> 19:00:00 gacha kutib yuboradi
  workflow_dispatch:
    inputs:
      hour:
        description: "Aniq soat (8, 13 yoki 19). Bo'sh qoldirsangiz darhol yuboradi"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Chrome o'rnatish (Selenium uchun)
        uses: browser-actions/setup-chrome@v1

      - name: Aniq soatni belgilash
        id: hour
        run: |
          case "${{ github.event.schedule }}" in
            "30 2 * * *")  echo "h=8"  >> "$GITHUB_OUTPUT" ;;
            "30 7 * * *")  echo "h=13" >> "$GITHUB_OUTPUT" ;;
            "30 13 * * *") echo "h=19" >> "$GITHUB_OUTPUT" ;;
            *) echo "h=${{ github.event.inputs.hour }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Kurslarni yuborish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          CALLME_USER: ${{ secrets.CALLME_USER }}
          TZ: Asia/Tashkent
          PYTHONUNBUFFERED: "1"
        run: python main.py send ${{ steps.hour.outputs.h }}

      - name: Saqlash
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_rates.json
          git commit -m "kurs yangilandi" || echo "o'zgarish yo'q"
          git pull --rebase
          git push
