name: Valyuta Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *' # Har kuni soat 9:00 da

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # JSON faylni saqlash uchun ruxsat
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests selenium webdriver-manager

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add oxirgi_narxlar.json
          git commit -m "Narxlar xotirasi yangilandi" || exit 0
          git push
