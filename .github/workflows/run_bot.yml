name: Valyuta bot

on:
  schedule:
    - cron: "0 4,8,14 * * *"   # 09:00, 13:00, 19:00 Toshkent vaqti — kurslarni yuborish
    - cron: "*/3 * * * *"      # har 3 daqiqada — /start va admin holatini tinglash
  workflow_dispatch:
    inputs:
      mode:
        description: "Rejim: send yoki listen"
        required: false
        default: "send"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Chrome o'rnatish (Selenium uchun)
        uses: browser-actions/setup-chrome@v1

      - name: Rejimni aniqlash
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4,8,14 * * *" ]; then
            echo "mode=send" >> "$GITHUB_OUTPUT"
          else
            echo "mode=listen" >> "$GITHUB_OUTPUT"
          fi

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py ${{ steps.mode.outputs.mode }}

      - name: offset.txt'ni saqlash (faqat listen rejimida kerak)
        if: steps.mode.outputs.mode == 'listen'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add offset.txt
          git commit -m "offset yangilandi" || echo "o'zgarish yo'q"
          git push
