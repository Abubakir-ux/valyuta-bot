name: Valyuta Bot

on:
  schedule:
    - cron: '0 4 * * *'    # 09:00 Toshkent vaqti
    - cron: '0 8 * * *'    # 13:00 Toshkent vaqti
    - cron: '0 15 * * *'   # 20:00 Toshkent vaqti
  workflow_dispatch:         # Qo'lda ham ishlatish uchun (test uchun qulay)

jobs:
  send-to-channel:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodni yuklab olish
        uses: actions/checkout@v3

      - name: 🐍 Python o'rnatish
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Kerakli kutubxonalar
        run: pip install -r requirements.txt

      - name: 🌐 Chrome o'rnatish
        uses: browser-actions/setup-chrome@latest

      - name: 🤖 Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: send
        run: python main.py
