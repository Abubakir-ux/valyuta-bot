name: Valyuta bot

on:
  schedule:
    - cron: "0 4,8,14 * * *"   # 09:00, 13:00, 19:00 Toshkent vaqti
  workflow_dispatch: {}         # qo'lda ham ishga tushirish uchun

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Chrome o'rnatish (Selenium uchun)
        uses: browser-actions/setup-chrome@v1

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
