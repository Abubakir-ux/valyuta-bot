name: Bank Kurslari Bot

on:
  schedule:
    # Har kuni Toshkent vaqti bilan 09:00 va 18:00 da ishga tushadi (UTC 04:00 va 13:00)
    - cron: '0 4,13 * * *'
  workflow_dispatch: # Qo'lda ishga tushirish imkoniyati

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v3

      - name: Pythonni sozlash
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni ishga tushirish
        run: python main.py 
