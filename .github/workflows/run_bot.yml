name: Valyuta Botini Ishlatish

on:
  schedule:
    # Vaqtlar UTC da belgilanadi. O'zbekiston UTC+5
    # 9:00 UZT  = 04:00 UTC
    # 13:00 UZT = 08:00 UTC
    # 18:00 UZT = 13:00 UTC
    - cron: '0 4,8,13 * * *'
  
  # GitHub saytidan "Run workflow" tugmasini bosib qo'lda ishlatish uchun:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v3

      - name: Pythonni o'rnatish
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
