name: Valyuta bot

on:
  schedule:
    - cron: "55 3 * * *"    # 08:55 Toshkent -> 09:00:00 gacha kutib yuboradi
    - cron: "55 7 * * *"    # 12:55 Toshkent -> 13:00:00 gacha kutib yuboradi
    - cron: "55 13 * * *"   # 18:55 Toshkent -> 19:00:00 gacha kutib yuboradi
    - cron: "*/3 * * * *"   # har 3 daqiqada - /start va admin holatini tinglash
  workflow_dispatch:
    inputs:
      mode:
        description: "Rejim: send yoki listen"
        required: false
        default: "send"

permissions:
  contents: write            # last_rates.json va offset.txt ni repoga push qilish uchun

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Chrome o'rnatish (Selenium uchun)
        uses: browser-actions/setup-chrome@v1

      - name: Rejimni va aniq soatni aniqlash
        id: mode
        run: |
          case "${{ github.event.schedule }}" in
            "55 3 * * *")  echo "mode=send"   >> "$GITHUB_OUTPUT"; echo "hour=9"  >> "$GITHUB_OUTPUT" ;;
            "55 7 * * *")  echo "mode=send"   >> "$GITHUB_OUTPUT"; echo "hour=13" >> "$GITHUB_OUTPUT" ;;
            "55 13 * * *") echo "mode=send"   >> "$GITHUB_OUTPUT"; echo "hour=19" >> "$GITHUB_OUTPUT" ;;
            "*/3 * * * *") echo "mode=listen" >> "$GITHUB_OUTPUT" ;;
            *) echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          TZ: Asia/Tashkent
        run: python main.py ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.hour }}

      - name: Oxirgi kursni saqlash (send rejimida)
        if: steps.mode.outputs.mode == 'send'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_rates.json
          git commit -m "kurs yangilandi" || echo "o'zgarish yo'q"
          git pull --rebase
          git push

      - name: offset.txt'ni saqlash (listen rejimida)
        if: steps.mode.outputs.mode == 'listen'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add offset.txt
          git commit -m "offset yangilandi" || echo "o'zgarish yo'q"
          git pull --rebase
          git push
