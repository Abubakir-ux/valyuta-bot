name: Valyuta Bot

on:
  schedule:
    # UTC vaqti bilan: 04:00 (9:00 UZ), 08:00 (13:00 UZ), 13:00 (18:00 UZ)
    - cron: '0 4,8,13 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # BU JUDA MUHIM
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests selenium webdriver-manager

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit and push changes # Faylni saqlash qismi
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "action@github.com"
          git add oxirgi_narxlar.json
          git commit -m "Narxlar xotirasi yangilandi" || exit 0
          git push
