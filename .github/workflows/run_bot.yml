name: Valyuta 

on:
  schedule:
    - cron: '0 9 * * *' # Har kuni soat 9:00 da (UTC)
  workflow_dispatch: # Qo'lda yurgizish uchun

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 # kerakli kutubxonalar

      - name: Run Scraper
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data.json
          git commit -m "Kurs yangilandi: $(date)" || echo "O'zgarish yo'q"
          git push
